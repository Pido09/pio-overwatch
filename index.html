<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIO Offset Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed deep-green sidebar (bottom tab bar on phones) + content column of panels.
   Broadcast rings from the PIO seal mark the balance card and sign-in panel. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#EEF3EF; --line:#DCE5DF; --line-strong:#C3D1C8;
  --ink:#0E1E33; --ink-2:#3A4A5C; --muted:#5E6E7E;
  --brand:#16803A; --brand-strong:#0F6B2E; --brand-ink:#FFFFFF; --brand-soft:#E2F2E6; --brand-glow:#3DBE5A;
  --side:#0B3D20; --side-2:#0F4A28; --side-ink:#E8F3EC; --side-muted:#A9C7B4;
  --navy:#0B2C6E; --gold:#B7791F; --gold-soft:#FCF1DC; --red:#B42318; --red-soft:#FDE8E6;
  --amber:#C27A0E;
  --shadow:0 1px 2px rgba(14,30,51,.06),0 4px 16px rgba(14,30,51,.05);
  --f-display:"Montserrat","Public Sans",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1411; --surface:#131E19; --surface-2:#18261F; --line:#24352C; --line-strong:#33483C;
    --ink:#E7EFEA; --ink-2:#C2D0C8; --muted:#93A69B;
    --brand:#2FA34E; --brand-strong:#5BD077; --brand-ink:#FFFFFF; --brand-soft:#163522; --brand-glow:#5BD077;
    --side:#08261A; --side-2:#0C3121; --side-ink:#E8F3EC; --side-muted:#93B7A1;
    --navy:#8FB0F0; --gold:#E3A84A; --gold-soft:#33270F; --red:#F07167; --red-soft:#3A1715; --amber:#E3A84A;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1411; --surface:#131E19; --surface-2:#18261F; --line:#24352C; --line-strong:#33483C;
  --ink:#E7EFEA; --ink-2:#C2D0C8; --muted:#93A69B;
  --brand:#2FA34E; --brand-strong:#5BD077; --brand-ink:#FFFFFF; --brand-soft:#163522; --brand-glow:#5BD077;
  --side:#08261A; --side-2:#0C3121; --side-ink:#E8F3EC; --side-muted:#93B7A1;
  --navy:#8FB0F0; --gold:#E3A84A; --gold-soft:#33270F; --red:#F07167; --red-soft:#3A1715; --amber:#E3A84A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand-glow);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* preview banner */
.preview{background:var(--gold-soft);color:var(--ink);border-bottom:1px solid var(--line);font-size:13px;padding:8px max(16px,env(safe-area-inset-left,0px));text-align:center}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.auth-main{display:flex;align-items:center;justify-content:center;padding:40px max(16px,env(safe-area-inset-left,0px))}
.auth-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:20px}
.auth-card .seal{width:84px;height:84px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.auth-card h1{font-size:32px;font-weight:800;color:var(--ink);margin-top:4px}
.lede{color:var(--muted);margin:6px 0 0}
.auth-side{position:relative;overflow:hidden;background:var(--side);color:var(--side-ink);display:flex;align-items:flex-end;padding:48px}
.rings{position:absolute;inset:0;pointer-events:none;
  background:repeating-radial-gradient(circle at 78% 22%, rgba(91,208,119,.16) 0 2px, transparent 2px 26px)}
.rings::after{content:"";position:absolute;width:56px;height:56px;border-radius:50%;background:#F5B92E;left:78%;top:22%;transform:translate(-50%,-50%);box-shadow:0 0 0 10px rgba(245,185,46,.18)}
.auth-side .copy{position:relative;max-width:420px}
.auth-side h2{font-size:30px;line-height:1.15;font-weight:800}
.auth-side p{color:var(--side-muted);margin:12px 0 0}
.rules{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.rules span{border:1px solid rgba(232,243,236,.25);border-radius:999px;padding:6px 12px;font-size:13px}

/* ---------- form controls ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.label{font-size:13px;font-weight:600;color:var(--ink-2)}
.hint{font-size:12.5px;color:var(--muted)}
.input,select.input{height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:0 12px;width:100%}
.input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.pin{letter-spacing:.4em;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:var(--r-sm);border:1px solid transparent;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:var(--brand-strong)}
:root[data-theme="dark"] .btn-primary:hover{color:#08261A}
.btn-ghost{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--surface);border-color:var(--line-strong);color:var(--red)}
.btn-danger:hover{background:var(--red-soft)}
.btn-sm{height:34px;padding:0 12px;font-size:13.5px}
.btn-block{width:100%}
.btn[disabled]{opacity:.6;cursor:progress}
.error{color:var(--red);font-size:13.5px;min-height:1em;margin:0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg label{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;background:var(--surface)}
.seg label b{font-size:14px;display:flex;align-items:center;gap:6px}
.seg label small{color:var(--muted);font-size:12px}
.seg input{position:absolute;opacity:0}
.seg input:checked+label{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.seg input:focus-visible+label{outline:3px solid var(--brand-glow);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--brand)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 14px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 20px;border-bottom:1px solid rgba(232,243,236,.12)}
.brand img{width:44px;height:44px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:15px;line-height:1.15;display:block}
.brand small{color:var(--side-muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:16px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--side-muted);padding:10px 12px;border-radius:var(--r-sm);cursor:pointer;text-align:left;font-weight:500;position:relative}
.nav button:hover{background:var(--side-2);color:var(--side-ink)}
.nav button[aria-current="page"]{background:var(--side-2);color:#fff;font-weight:600}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:#5BD077}
.badge{margin-left:auto;background:#F5B92E;color:#3A2600;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;border-top:1px solid rgba(232,243,236,.12);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.who{display:flex;gap:10px;align-items:center;padding:6px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#5BD077;color:#08261A;font-weight:800;font-size:13px;flex:none}
.who b{display:block;font-size:14px}
.who small{color:var(--side-muted);font-size:12px}
.cap{text-transform:capitalize}
.side-foot .nav{margin-top:0}

.main{min-width:0;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head h1{font-size:26px;font-weight:800}
.head p{margin:4px 0 0;color:var(--muted)}
.topbar{display:none}
.tabbar{display:none}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-size:16px;font-weight:700}
.panel-b{padding:18px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.tile .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile .v{font-family:var(--f-display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.tile .s{font-size:13px;color:var(--muted)}
.tile.warn .k{color:var(--amber)}

.hero{position:relative;overflow:hidden;background:var(--side);color:var(--side-ink);border-radius:var(--r);padding:26px 26px 22px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.hero .rings{background:repeating-radial-gradient(circle at 92% 10%, rgba(91,208,119,.18) 0 2px, transparent 2px 22px)}
.hero .rings::after{left:92%;top:10%;width:34px;height:34px}
.hero > *:not(.rings){position:relative}
.hero .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted)}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.hero .sub{color:var(--side-muted);margin-top:6px;font-size:14px}
.hero .btn-ghost{background:rgba(255,255,255,.08);border-color:rgba(232,243,236,.3);color:#fff}
.hero .btn-primary{background:#5BD077;color:#08261A}

.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.row .mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.mark.earn{background:var(--brand-soft);color:var(--brand)}
.mark.use{background:var(--gold-soft);color:var(--gold)}
.mark.pend{background:var(--surface-2);color:var(--muted)}
.row .body{min-width:0;flex:1}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.plus{color:var(--brand)}
.amt.minus{color:var(--gold)}
.row .acts{display:flex;gap:6px;flex:none}
.row.rv{flex-wrap:wrap}
.row.rv .body{flex:1 1 140px}
.row.rv .acts{flex:1 0 100%;padding-left:46px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.Confirmed{background:var(--brand-soft);color:var(--brand)}
.pill.Pending{background:var(--gold-soft);color:var(--gold)}
.pill.Rejected{background:var(--red-soft);color:var(--red)}
.pill.off{background:var(--surface-2);color:var(--muted)}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:10px 18px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:12px 18px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters select{height:36px;width:auto;min-width:140px}
.panel-h select.input{height:36px;width:auto;max-width:100%}

/* ---------- calendar ---------- */
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav h2{min-width:170px;text-align:center}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);cursor:pointer}
.icon-btn:hover{background:var(--surface-2)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:10px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.day{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--surface);cursor:pointer;text-align:left;border-top:0;border-left:0;min-width:0}
.day:nth-child(7n){border-right:0}
.day:hover{background:var(--surface-2)}
.day.out{background:var(--bg);color:var(--muted)}
.day.wknd .dn{color:var(--muted)}
.day.sel{box-shadow:inset 0 0 0 2px var(--brand)}
.dn{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.day.today .dn{background:var(--brand);color:#fff}
.ev{font-size:11.5px;line-height:1.3;border-radius:5px;padding:2px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ev.earn{background:var(--brand-soft);color:var(--brand)}
.ev.use{background:var(--gold-soft);color:var(--gold)}
.ev.pend{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-strong)}
.more{font-size:11.5px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ---------- modal / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,20,13,.5);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:var(--r);width:100%;max-width:440px;box-shadow:0 20px 50px rgba(0,0,0,.25);border:1px solid var(--line)}
.modal .panel-b{display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.stack{display:flex;flex-direction:column;gap:16px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.note{font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:12px}
.note div{display:flex;gap:10px}
.note svg{color:var(--brand);margin-top:2px}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
.loading img{width:72px;height:72px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .auth{grid-template-columns:minmax(0,1fr)}
  .auth-side{display:none}
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:var(--side);color:var(--side-ink);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .topbar img{width:34px;height:34px}
  .topbar b{font-family:var(--f-display);font-weight:800;font-size:15px;flex:1}
  .topbar button{background:none;border:0;color:var(--side-ink);display:grid;place-items:center;width:38px;height:38px;border-radius:8px;cursor:pointer}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 2px;cursor:pointer;position:relative}
  .tabbar button[aria-current="page"]{color:var(--brand)}
  .tabbar .badge{position:absolute;top:0;left:55%;margin:0;padding:0 6px}
  .main{padding-block:20px 96px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .day{min-height:64px;padding:4px}
  .ev{font-size:0;padding:0;height:6px;border-radius:3px}
  .more{display:none}
}
@media (max-width:560px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tiles.three{grid-template-columns:minmax(0,1fr)}
  .hero .big{font-size:36px}
  .head h1{font-size:22px}
  .seg{grid-template-columns:minmax(0,1fr)}
  .two{grid-template-columns:minmax(0,1fr)}
  .row{padding:12px 14px}
  .cal-nav h2{min-width:0;font-size:15px}
  .dn{font-size:12px;width:22px;height:22px}
}
/* ---------- divisions ---------- */
.dbadge{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--dc);color:var(--dfg);flex:none;box-shadow:inset 0 0 0 1px rgba(14,30,51,.14);overflow:hidden}
.dbadge img{width:100%;height:100%;object-fit:cover}
.dbadge svg.i{width:56%;height:56%}
.divpick{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.divpick legend{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px;padding:0}
.divpick input{position:absolute;opacity:0}
.divpick label{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px}
.divpick label:hover{border-color:var(--brand)}
.divpick .tick{margin-left:auto;color:var(--brand);opacity:0}
.divpick input:checked+label{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:var(--brand-soft)}
.divpick input:checked+label .tick{opacity:1}
.divpick input:focus-visible+label{outline:3px solid var(--brand-glow);outline-offset:2px}
.dchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}

<body>
<div id="app"><div class="loading"><img src="pio-logo.webp" alt="Loading"></div></div>
<div id="modal"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="config.js"></script>
<script>
var LOGO = 'pio-logo.webp';
var HPD = 8, WORKDAYS = 22;
var API = (window.PIO_API_URL || '').trim();
var LIVE = /^https:\/\/script\.google\.com\//.test(API);
var S = { token: null, me: null, users: [], entries: [], divisions: [], view: 'dashboard', cal: null, mon: null,
          calUser: 'all', selDay: null, dashDiv: 'all', rf: { user: 'all', div: 'all', type: 'all', status: 'all' }, needsSetup: false };

/* ---------- utilities ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function sGet(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }
function sSet(k,v){ try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch(e){} }
function lGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lSet(k,v){ try { localStorage.setItem(k, v); } catch(e){} }
function today(){ return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Manila' }).format(new Date()); }
function curMonth(){ return today().slice(0,7); }
function pd(s){ var a = s.split('-'); return new Date(+a[0], +a[1]-1, +(a[2]||1)); }
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fDate(s, opt){ return pd(s).toLocaleDateString('en-PH', opt || { month:'short', day:'numeric', year:'numeric' }); }
function fMonth(m){ return pd(m + '-01').toLocaleDateString('en-PH', { month:'long', year:'numeric' }); }
function nextMonthStart(m){ var d = pd(m + '-01'); d.setMonth(d.getMonth() + 1); return ymd(d); }
function shiftMonth(m, n){ var d = pd(m + '-01'); d.setMonth(d.getMonth() + n); return ymd(d).slice(0,7); }
function fH(h){
  h = Math.round(h * 10) / 10;
  var neg = h < 0; h = Math.abs(h);
  var d = Math.floor(h / HPD), r = Math.round((h - d*HPD) * 10) / 10, p = [];
  if (d) p.push(d + (d === 1 ? ' day' : ' days'));
  if (r || !d) p.push(r + (r === 1 ? ' hr' : ' hrs'));
  return (neg ? '−' : '') + p.join(' ');
}
function fHs(h){ return (Math.round(h*10)/10) + 'h'; }
function initials(n){ return String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(function(w){return w[0];}).join('').toUpperCase(); }
function userOf(u){ return S.users.filter(function(z){ return z.username === u; })[0]; }
function userName(u){ var x = userOf(u); return x ? x.name : u; }
function firstName(u){ return userName(u).split(' ')[0]; }
function isAdmin(){ return S.me && S.me.role === 'admin'; }

var ICONS = {
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',

  moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',

  left:'<path d="m15 18-6-6 6-6"/>', right:'<path d="m9 18 6-6-6-6"/>',

  pin:'<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  edit:'<path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/>',
  upload:'<path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>',
  /* division icons */
  camera:'<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/>',
  monument:'<path d="M12 2.5 14 6v11h-4V6z"/><path d="M8.5 17h7l1 2.5h-9z"/><path d="M5.5 21.5h13"/>',
  folder:'<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/>',
  megaphone:'<path d="M3 10v4h3l7 4V6l-7 4z"/><path d="M17 9a4 4 0 0 1 0 6"/>',
  pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  radio:'<circle cx="12" cy="12" r="2"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/>',
  star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>'
};
var DIV_ICONS = ['camera','monument','folder','megaphone','pen','radio','users','star'];
var SWATCHES = ['#0B2C6E','#1D4ED8','#C8202A','#16803A','#F2B233','#6D28D9','#0F766E','#FFFFFF'];
function ic(n){ return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[n] || ICONS.star) + '</svg>'; }
var CAT_ICON = { 'Holiday':'flag', 'Weekend':'sun', 'After 5 PM':'moon' };

function divOf(id){ return S.divisions.filter(function(d){ return d.id === id; })[0]; }
function fgFor(hex){
  var n = parseInt(String(hex).slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.62 ? '#0B2C6E' : '#FFFFFF';
}
function divBadge(d, size){
  if (!d) return '';
  size = size || 40;
  return '<span class="dbadge" style="--dc:' + esc(d.color) + ';--dfg:' + fgFor(d.color) + ';width:' + size + 'px;height:' + size + 'px;border-radius:' + Math.round(size/4) + 'px">' +
    (d.logo ? '<img src="' + esc(d.logo) + '" alt="">' : ic(d.icon)) + '</span>';
}
function divChip(id){
  var d = divOf(id);
  return d ? '<span class="dchip" style="--dc:' + esc(d.color) + '"><i></i>' + esc(d.short || d.name) + '</span>' : '<span class="dchip hint">No division</span>';
}

function toast(msg){
  var t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 2800);
}

/* ---------- server calls ---------- */
function call(action, p){
  return new Promise(function(resolve, reject){
    function done(r){
      if (r && r.ok) return resolve(r.data);
      if (r && r.expired){ S.token = null; sSet('pio_tok', null); S.me = null; render(); }
      reject(new Error(r && r.error ? r.error : 'Something went wrong. Please try again.'));
    }
    if (LIVE){
      fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                   body: JSON.stringify({ action: action, p: p || {}, token: S.token }) })
        .then(function(r){ return r.json(); })
        .then(done)
        .catch(function(){ reject(new Error('Could not reach the server. Check your connection and try again.')); });
    } else {
      setTimeout(function(){ done(Mock.api(action, p || {}, S.token)); }, 150);
    }
  });
}
function refresh(){
  return call('data').then(function(d){
    S.me = d.me; S.users = d.users; S.entries = d.entries; S.divisions = d.divisions;
    HPD = d.hoursPerDay || 8; WORKDAYS = d.workdays || 22; render();
  });
}

/* ---------- derived numbers ----------
   Offsets earned in a month are added to the available balance when that month closes. */
function stats(u, divId){
  var o = { closed:0, used:0, month:0, pending:0, pendN:0, avail:0, lastUse:null, earnedY:0, usedY:0, usedM:0 };
  var y = today().slice(0,4), m = curMonth();
  S.entries.forEach(function(e){
    if (u && e.username !== u) return;
    if (divId && divId !== 'all'){ var x = userOf(e.username); if (!x || x.division !== divId) return; }
    if (e.status === 'Confirmed'){
      if (e.type === 'EARN'){
        if (e.date.slice(0,7) < m) o.closed += e.hours; else o.month += e.hours;
        if (e.date.slice(0,4) === y) o.earnedY += e.hours;
      } else {
        o.used += e.hours;
        if (e.date.slice(0,4) === y) o.usedY += e.hours;
        if (e.date.slice(0,7) === m) o.usedM += e.hours;
        if (!o.lastUse || e.date > o.lastUse) o.lastUse = e.date;
      }
    } else if (e.status === 'Pending'){ o.pending += e.hours; o.pendN++; }
  });
  o.avail = o.closed - o.used;
  return o;
}
function monthStats(u, m){
  var o = { earned:0, pending:0, used:0, n:0 };
  S.entries.forEach(function(e){
    if (e.username !== u || e.date.slice(0,7) !== m) return;
    if (e.type === 'EARN' && e.status === 'Confirmed'){ o.earned += e.hours; o.n++; }
    else if (e.type === 'EARN' && e.status === 'Pending') o.pending += e.hours;
    else if (e.type === 'USE') o.used += e.hours;
  });
  return o;
}
function sorted(list){ return list.slice().sort(function(a,b){ return a.date === b.date ? (b.createdAt > a.createdAt ? 1 : -1) : (b.date > a.date ? 1 : -1); }); }
function pending(){ return sorted(S.entries.filter(function(e){ return e.status === 'Pending'; })); }
function closesOn(m){ return fDate(nextMonthStart(m), { month:'long', day:'numeric' }); }

/* ---------- render ---------- */
function render(){
  var app = document.getElementById('app');
  var banner = LIVE ? '' : '<div class="preview">Preview mode with sample data. Nothing is saved. Sign in as <b>admin</b> or <b>jdelacruz</b>, PIN <b>1234</b>. To go live, put the Apps Script web app URL in config.js.</div>';
  if (!S.me){ app.innerHTML = banner + (S.needsSetup ? viewSetup() : viewLogin()); var f = app.querySelector('#lu, #sn'); if (f) f.focus(); return; }
  var nav = isAdmin()
    ? [['dashboard','grid','Dashboard'],['approvals','check','Approvals'],['calendar','cal','Calendar'],['monthly','month','Monthly'],['records','list','Records'],['staff','users','Staff']]
    : [['dashboard','grid','Dashboard'],['log','plus','Log offset'],['calendar','cal','Calendar'],['monthly','month','Monthly'],['records','list','Records']];
  var pc = isAdmin() ? pending().length : 0;
  function navBtn(n){ return '<button data-go="' + n[0] + '"' + (S.view === n[0] ? ' aria-current="page"' : '') + '>' + ic(n[1]) + '<span>' + n[2] + '</span>' + (n[0] === 'approvals' && pc ? '<span class="badge">' + pc + '</span>' : '') + '</button>'; }
  var views = { dashboard: isAdmin() ? viewAdminDash : viewEmpDash, log: viewLog, approvals: viewApprovals, calendar: viewCalendar,
                monthly: viewMonthly, records: viewRecords, staff: viewStaff };
  if (!views[S.view] || (S.view === 'staff' && !isAdmin()) || (S.view === 'approvals' && !isAdmin())) S.view = 'dashboard';
  var body = views[S.view]();
  var myDiv = divOf(S.me.division);
  app.innerHTML = banner +
    '<div class="shell">' +
      '<aside class="side"><div class="brand"><img src="' + LOGO + '" alt="Provincial Information Office seal"><div><b>Offset Tracker</b><small>PIO Camarines Norte</small></div></div>' +
        '<nav class="nav" aria-label="Main">' + nav.map(navBtn).join('') + '</nav>' +
        '<div class="side-foot"><div class="who">' + (myDiv ? divBadge(myDiv, 36) : '<span class="avatar">' + esc(initials(S.me.name)) + '</span>') +
          '<div style="min-width:0"><b>' + esc(S.me.name) + '</b><small><span class="cap">' + esc(S.me.role) + '</span> · ' + (myDiv ? esc(myDiv.short) : '@' + esc(S.me.username)) + '</small></div></div>' +
        '<div class="nav"><button data-act="changePin">' + ic('key') + '<span>Change PIN</span></button><button data-act="logout">' + ic('out') + '<span>Sign out</span></button></div></div>' +
      '</aside>' +
      '<div style="min-width:0">' +
        '<header class="topbar"><img src="' + LOGO + '" alt=""><b>Offset Tracker</b><button data-act="changePin" aria-label="Change PIN">' + ic('key') + '</button><button data-act="logout" aria-label="Sign out">' + ic('out') + '</button></header>' +
        '<main class="main"><div class="wrap">' + body + '</div></main>' +
      '</div>' +
      '<nav class="tabbar" aria-label="Main">' + nav.map(navBtn).join('') + '</nav>' +
    '</div>';
}

function head(title, sub, action){
  return '<div class="head"><div><h1>' + title + '</h1><p>' + sub + '</p></div>' + (action || '') + '</div>';
}

/* ----- auth ----- */
function authSide(){
  return '<aside class="auth-side"><div class="rings"></div><div class="copy"><p class="eyebrow" style="color:#8FE3A6">Para sa mga Job Order at COS</p>' +
    '<h2>Every extra day you give, recorded and counted.</h2>' +
    '<p>Record work beyond the ' + WORKDAYS + '-day schedule: holidays, weekends and events past 5 PM. Offsets are counted at the end of each month and added to your balance on the 1st.</p>' +
    '<div class="rules"><span>' + WORKDAYS + ' workdays a month</span><span>Counted every month-end</span><span>' + HPD + ' hours = 1 day</span></div></div></aside>';
}
function divPicker(selected, required){
  if (!S.divisions.length) return '';
  return '<fieldset class="divpick"><legend>Your division</legend>' +
    S.divisions.map(function(d, i){
      return '<input type="radio" name="division" id="dv' + i + '" value="' + esc(d.id) + '"' + (selected === d.id ? ' checked' : '') + (required && i === 0 ? ' required' : '') + '>' +
        '<label for="dv' + i + '">' + divBadge(d, 38) + '<span>' + esc(d.name) + '</span><span class="tick">' + ic('tick') + '</span></label>';
    }).join('') + '</fieldset>';
}
function viewLogin(){
  return '<div class="auth"><div class="auth-main"><form class="auth-card" data-form="login" autocomplete="off">' +
    '<img class="seal" src="' + LOGO + '" alt="Provincial Information Office, Camarines Norte seal">' +
    '<div><p class="eyebrow">Provincial Information Office · Camarines Norte</p><h1>Offset Tracker</h1><p class="lede">Choose your division, then sign in with your username and PIN.</p></div>' +
    divPicker(lGet('pio_div')) +
    '<div class="field"><label for="lu">Username</label><input class="input" id="lu" name="username" autocapitalize="none" spellcheck="false" required></div>' +
    '<div class="field"><label for="lp">PIN</label><input class="input pin" id="lp" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" required></div>' +
    '<p class="error" id="err"></p>' +
    '<button class="btn btn-primary btn-block" type="submit">Sign in</button>' +
    '<p class="hint">Forgot your PIN? Ask an admin to reset it.</p>' +
    '</form></div>' + authSide() + '</div>';
}
function viewSetup(){
  return '<div class="auth"><div class="auth-main"><form class="auth-card" data-form="setup" autocomplete="off">' +
    '<img class="seal" src="' + LOGO + '" alt="Provincial Information Office, Camarines Norte seal">' +
    '<div><p class="eyebrow">First-time setup</p><h1>Create the admin account</h1><p class="lede">This account confirms offsets and manages staff and divisions. You can add more admins later.</p></div>' +
    '<div class="field"><label for="sn">Full name</label><input class="input" id="sn" name="name" required></div>' +
    '<div class="field"><label for="su">Username</label><input class="input" id="su" name="username" autocapitalize="none" spellcheck="false" required><span class="hint">Lowercase letters, numbers, dots or dashes.</span></div>' +
    '<div class="two"><div class="field"><label for="sp">PIN</label><input class="input pin" id="sp" name="pin" type="password" inputmode="numeric" maxlength="6" required></div>' +
    '<div class="field"><label for="sp2">Repeat PIN</label><input class="input pin" id="sp2" name="pin2" type="password" inputmode="numeric" maxlength="6" required></div></div>' +
    divPicker('') +
    '<p class="error" id="err"></p><button class="btn btn-primary btn-block" type="submit">Create admin account</button></form></div>' + authSide() + '</div>';
}

/* ----- shared pieces ----- */
function entryRow(e, opts){
  opts = opts || {};
  var use = e.type === 'USE', pend = e.status === 'Pending';
  var cls = use ? 'use' : (pend ? 'pend' : 'earn');
  var title = (opts.showName ? esc(userName(e.username)) + ' · ' : '') + (use ? 'Offset used' : esc(e.event || e.category));
  var meta = fDate(e.date, { weekday:'short', month:'short', day:'numeric', year:'numeric' }) + (use ? '' : ' · ' + esc(e.category)) + (e.venue ? ' · ' + esc(e.venue) : '');
  var acts = '';
  if (opts.review) acts = '<div class="acts"><button class="btn btn-sm btn-primary" data-act="review" data-id="' + e.id + '" data-d="Confirmed">Confirm</button><button class="btn btn-sm btn-danger" data-act="review" data-id="' + e.id + '" data-d="Rejected">Reject</button></div>';
  return '<li class="row' + (opts.review ? ' rv' : '') + '"><span class="mark ' + cls + '">' + ic(use ? 'minus' : (CAT_ICON[e.category] || 'plus')) + '</span>' +
    '<div class="body"><div class="t">' + title + '</div><div class="m">' + meta + '</div></div>' +
    (opts.review ? '' : '<span class="pill ' + e.status + '">' + e.status + '</span>') +
    '<span class="amt ' + (use ? 'minus' : 'plus') + '">' + (use ? '−' : '+') + fHs(e.hours) + '</span>' + acts + '</li>';
}
function tile(k, v, s, cls, icon){ return '<div class="panel tile ' + (cls||'') + '"><span class="k">' + (icon ? ic(icon) : '') + k + '</span><span class="v">' + v + '</span><span class="s">' + s + '</span></div>'; }
function divSelect(id, val, label, withAll, withNone){

/* ----- calendar ----- */
function viewCalendar(){
  if (!S.cal){ var t = pd(today()); S.cal = { y: t.getFullYear(), m: t.getMonth() }; }
  var y = S.cal.y, m = S.cal.m, first = new Date(y, m, 1), start = new Date(y, m, 1 - first.getDay());
  var adm = isAdmin(), td = today();
  var list = S.entries.filter(function(e){ return e.status !== 'Rejected' && (!adm || S.calUser === 'all' || e.username === S.calUser); });
  var byDay = {};
  list.forEach(function(e){ (byDay[e.date] = byDay[e.date] || []).push(e); });
  var cells = '';
  for (var i = 0; i < 42; i++){
    var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), k = ymd(d), evs = byDay[k] || [];
    if (i >= 35 && d.getMonth() !== m) break;
    var cls = 'day' + (d.getMonth() !== m ? ' out' : '') + (d.getDay() % 6 === 0 ? ' wknd' : '') + (k === td ? ' today' : '') + (k === S.selDay ? ' sel' : '');
    var chips = evs.slice(0,3).map(function(e){
      var c = e.type === 'USE' ? 'use' : (e.status === 'Pending' ? 'pend' : 'earn');
      var label = adm && S.calUser === 'all' ? firstName(e.username) : (e.type === 'USE' ? 'Used' : e.event);
      return '<span class="ev ' + c + '">' + (e.type === 'USE' ? '−' : '+') + fHs(e.hours) + ' ' + esc(label) + '</span>';
    }).join('') + (evs.length > 3 ? '<span class="more">+' + (evs.length - 3) + ' more</span>' : '');
    cells += '<button class="' + cls + '" data-day="' + k + '" aria-label="' + fDate(k, { weekday:'long', month:'long', day:'numeric' }) + (evs.length ? ', ' + evs.length + ' entries' : '') + '"><span class="dn">' + d.getDate() + '</span>' + chips + '</button>';
  }
  var filter = adm ? '<select class="input" id="calUser" aria-label="Show employee" style="height:36px;width:auto"><option value="all">All staff</option>' +
    S.users.map(function(u){ return '<option value="' + esc(u.username) + '"' + (S.calUser === u.username ? ' selected' : '') + '>' + esc(u.name) + '</option>'; }).join('') + '</select>' : '';
  var sel = '';
  if (S.selDay){
    var de = sorted(byDay[S.selDay] || []);
    sel = '<section class="panel"><div class="panel-h"><h2>' + fDate(S.selDay, { weekday:'long', month:'long', day:'numeric', year:'numeric' }) + '</h2>' +
      (adm ? '<button class="btn btn-sm btn-ghost" data-act="useModal" data-date="' + S.selDay + '"' + (S.calUser !== 'all' ? ' data-u="' + esc(S.calUser) + '"' : '') + '>' + ic('minus') + 'Record use on this day</button>' : '') + '</div>' +
      (de.length ? '<ul class="list">' + de.map(function(e){ return entryRow(e, { showName: adm }); }).join('') + '</ul>' : '<div class="empty">No offsets on this day.</div>') + '</section>';
  }
  return head('Calendar', adm ? 'Offsets earned and used by staff, day by day.' : 'Your offsets earned and used, day by day.') +
    '<section class="panel"><div class="panel-h"><div class="cal-nav"><button class="icon-btn" data-act="calPrev" aria-label="Previous month">' + ic('left') + '</button>' +
      '<h2>' + first.toLocaleDateString('en-PH', { month:'long', year:'numeric' }) + '</h2><button class="icon-btn" data-act="calNext" aria-label="Next month">' + ic('right') + '</button>' +
      '<button class="btn btn-sm btn-ghost" data-act="calToday">Today</button></div>' + filter + '</div>' +
      '<div class="cal">' + ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(d){ return '<div class="dow">' + d + '</div>'; }).join('') + cells + '</div>' +
      '<div class="panel-b legend"><span><i style="background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)"></i>Earned (confirmed)</span><span><i style="box-shadow:inset 0 0 0 1px var(--line-strong)"></i>Waiting for review</span><span><i style="background:var(--gold-soft);box-shadow:inset 0 0 0 1px var(--gold)"></i>Offset used</span></div>' +
    '</section>' + sel;

      '<button type="button" class="btn btn-sm btn-ghost" data-act="divNoLogo" id="dnolog"' + (d.logo ? '' : ' hidden') + '>Remove logo</button></div><span class="hint">A square PNG or JPG works best. It replaces the icon.</span></div>',

function divPreview(){
  var p = document.getElementById('dprev'); if (!p) return;
  p.innerHTML = divBadge({ color: M.color, icon: M.icon, logo: M.logo }, 56);

  document.querySelectorAll('#modal .iconpick button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.n === M.icon)); });
  var nl = document.getElementById('dnolog'); if (nl) nl.hidden = !M.logo;
}
function readLogo(file){
  return new Promise(function(resolve, reject){
    var r = new FileReader();
    r.onload = function(){
      var img = new Image();
      img.onload = function(){
        var c = document.createElement('canvas'), s = 128; c.width = s; c.height = s;
        var x = c.getContext('2d'), k = Math.max(s / img.width, s / img.height), w = img.width * k, h = img.height * k;
        x.drawImage(img, (s - w) / 2, (s - h) / 2, w, h);
        var out = c.toDataURL('image/png');
        if (out.length > 45000) out = c.toDataURL('image/webp', 0.85);
        if (out.indexOf('data:image/webp') !== 0 && out.length > 45000) out = c.toDataURL('image/jpeg', 0.82);
        out.length > 45000 ? reject(new Error('That image is too detailed. Try a simpler logo.')) : resolve(out);
      };
      img.onerror = function(){ reject(new Error('That file is not an image we can read.')); };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

/* ---------- events ---------- */
document.addEventListener('click', function(ev){
  var t = ev.target.closest('[data-go],[data-act],[data-day],[data-h]');
  if (!t) return;
  if (t.dataset.go){ S.view = t.dataset.go; S.selDay = null; render(); window.scrollTo(0,0); return; }
  if (t.dataset.day){ S.selDay = S.selDay === t.dataset.day ? null : t.dataset.day; render(); return; }
  if (t.dataset.h){ var h = document.getElementById('fh'); if (h) h.value = t.dataset.h; return; }
  var a = t.dataset.act;
  if (a === 'closeScrim'){ if (ev.target === t) closeModal(); return; }
  if (a === 'close') return closeModal();
  if (a === 'logout'){ call('logout').catch(function(){}); S.token = null; S.me = null; sSet('pio_tok', null); S.view = 'dashboard'; render(); return; }
  if (a === 'calPrev' || a === 'calNext'){ var n = new Date(S.cal.y, S.cal.m + (a === 'calNext' ? 1 : -1), 1); S.cal = { y: n.getFullYear(), m: n.getMonth() }; S.selDay = null; render(); return; }
  if (a === 'calToday'){ S.cal = null; S.selDay = today(); render(); return; }
  if (a === 'monPrev' || a === 'monNext'){ S.mon = shiftMonth(S.mon || curMonth(), a === 'monNext' ? 1 : -1); if (S.mon > curMonth()) S.mon = curMonth(); render(); return; }
  if (a === 'useModal') return useModal(t.dataset.u, t.dataset.date);
  if (a === 'divModal') return divModal(t.dataset.id);
  if (a === 'divColor'){ M.color = t.dataset.c; document.getElementById('dcol').value = M.color; divPreview(); return; }
  if (a === 'divIcon'){ M.icon = t.dataset.n; divPreview(); return; }
  if (a === 'divNoLogo'){ M.logo = ''; divPreview(); return; }
  if (a === 'divDelete'){
    if (t.dataset.sure !== '1'){ t.dataset.sure = '1'; t.innerHTML = ic('trash') + 'Tap again to delete'; return; }
    busy(t, call('deleteDivision', { id: M.id }).then(function(){ closeModal(); toast('Division deleted'); return refresh(); }), 'merr'); return;
  }
  if (a === 'changePin') return modal('Change your PIN',
    '<div class="field"><label for="op">Current PIN</label><input class="input pin" id="op" name="oldPin" type="password" inputmode="numeric" maxlength="6" required></div>' +
    '<div class="field"><label for="np">New PIN</label><input class="input pin" id="np" name="newPin" type="password" inputmode="numeric" maxlength="6" required><span class="hint">4 to 6 digits.</span></div>',
    '<button type="button" class="btn btn-ghost" data-act="close">Cancel</button><button class="btn btn-primary" type="submit">Save PIN</button>', 'changePin');
  if (a === 'pinModal') return modal('Reset PIN for ' + esc(userName(t.dataset.u)),
    '<input type="hidden" name="username" value="' + esc(t.dataset.u) + '"><div class="field"><label for="rp">New PIN</label><input class="input pin" id="rp" name="pin" inputmode="numeric" maxlength="6" required><span class="hint">Tell the employee their new PIN in person.</span></div>',
    '<button type="button" class="btn btn-ghost" data-act="close">Cancel</button><button class="btn btn-primary" type="submit">Reset PIN</button>', 'resetPin');
  if (a === 'delModal'){
    var e = S.entries.filter(function(x){ return x.id === t.dataset.id; })[0]; if (!e) return;
    return modal('Remove this entry?', '<p style="margin:0">' + esc(userName(e.username)) + ' · ' + (e.type === 'USE' ? 'Offset used' : esc(e.event)) + ' · ' + fDate(e.date) + ' · ' + fHs(e.hours) + '</p><p class="hint" style="margin:0">The balance is recalculated. This cannot be undone.</p>',
      '<button type="button" class="btn btn-ghost" data-act="close">Keep it</button><button type="button" class="btn btn-danger" data-act="del" data-id="' + e.id + '">' + ic('trash') + 'Remove</button>');
  }
  if (a === 'del'){ busy(t, call('deleteEntry', { id: t.dataset.id }).then(function(){ closeModal(); toast('Entry removed'); return refresh(); }), 'merr'); return; }
  if (a === 'review'){ var d = t.dataset.d; busy(t, call('review', { id: t.dataset.id, decision: d }).then(function(){ toast(d === 'Confirmed' ? 'Offset confirmed' : 'Offset rejected'); return refresh(); })); return; }
  if (a === 'toggleActive'){ var on = t.dataset.a === '1'; busy(t, call('setActive', { username: t.dataset.u, active: on }).then(function(){ toast(on ? 'Account activated' : 'Account deactivated'); return refresh(); })); return; }
});
document.addEventListener('change', function(ev){
  var el = ev.target, id = el.id;
  if (id === 'calUser'){ S.calUser = el.value; render(); }

});
document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape' && document.querySelector('#modal .scrim')) closeModal(); });

function busy(btn, p, errId){
  btn.disabled = true;
  return p.catch(function(e){ var el = errId && document.getElementById(errId); if (el) el.textContent = e.message; else toast(e.message); })
          .then(function(){ if (document.body.contains(btn)) btn.disabled = false; });
}
document.addEventListener('submit', function(ev){
  var f = ev.target.closest('form[data-form]'); if (!f) return;
  ev.preventDefault();
  var d = {}; new FormData(f).forEach(function(v, k){ if (typeof v === 'string') d[k] = v; });
  var kind = f.dataset.form, btn = f.querySelector('[type=submit]'), inModal = !!f.closest('#modal'), errId = inModal ? 'merr' : 'err';
  var err = document.getElementById(errId); if (err) err.textContent = '';
  var p;
  if (kind === 'login'){ if (d.division) lSet('pio_div', d.division); p = call('login', d).then(start); }
  else if (kind === 'setup'){
    if (d.pin !== d.pin2){ err.textContent = 'The two PINs do not match.'; return; }
    p = call('setup', d).then(start);
  }
  else if (kind === 'earn'){ d.noTravelOrder = !!d.noTravelOrder; p = call('logEarn', d).then(function(){ toast(isAdmin() ? 'Offset added and confirmed' : 'Sent for confirmation'); S.view = isAdmin() ? 'records' : 'dashboard'; return refresh(); }); }
  else if (kind === 'recordUse') p = call('recordUse', d).then(function(){ closeModal(); toast('Offset use recorded'); return refresh(); });
  else if (kind === 'addUser') p = call('addUser', d).then(function(){ toast(d.name + ' can now sign in'); return refresh(); });
  else if (kind === 'resetPin') p = call('resetPin', d).then(function(){ closeModal(); toast('PIN reset'); });
  else if (kind === 'changePin') p = call('changePin', d).then(function(){ closeModal(); toast('Your PIN was changed'); });
  else if (kind === 'saveDivision'){ d.id = M.id; d.color = M.color; d.icon = M.icon; d.logo = M.logo || ''; p = call('saveDivision', d).then(function(){ closeModal(); toast('Division saved'); return refresh(); }); }
  if (p) busy(btn, p, errId);
});
function start(r){ S.token = r.token; sSet('pio_tok', r.token); S.view = 'dashboard'; return refresh(); }

  function pub(u){ return { username:u.username, name:u.name, role:u.role, division:u.division, active:u.active }; }
  function find(u){ return users.filter(function(x){ return x.username === String(u||'').toLowerCase(); })[0]; }

  function fail(m){ return { ok:false, error:m }; }

  return { api: function(a, p, tok){
