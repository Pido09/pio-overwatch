<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PIO Overwatch</title>
<meta name="theme-color" content="#0B4A25">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Overwatch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: deep-green sidebar (floating tab bar on phones). Each page opens with a green banner
   woven with a banig pattern; panels rise over its lower edge on a 12-column widget grid. */
:root{
  --bg:#EEF3EF; --surface:#FFFFFF; --surface-2:#F3F7F4; --line:#E0E8E2; --line-strong:#C7D4CB;
  --ink:#0E1E33; --ink-2:#34465A; --muted:#5D6D7D;
  --brand:#16803A; --brand-strong:#0F6B2E; --brand-soft:#E2F2E7; --brand-glow:#3DBE5A; --mint:#5BD077;
  --gold:#8A5A0B; --gold-soft:#FCF1DC; --sun:#F5B92E;
  --red:#B42318; --red-soft:#FDE8E6;
  --navy:#0B2C6E; --navy-soft:#E6EDFA; --violet:#5B3FC4; --violet-soft:#EEEAFB; --rose:#B4235A; --rose-soft:#FCE7EF;
  --band:linear-gradient(135deg,#0F6B2E 0%,#0B4F27 100%);
  --side:linear-gradient(185deg,#0E4A27 0%,#0A3A1E 55%,#072A16 100%);
  --page:linear-gradient(180deg,#E6EFE8 0,#EEF3EF 360px);
  --weave:none;
  --weave-ink:none;
  --shadow:0 1px 2px rgba(14,30,51,.05),0 4px 14px -6px rgba(14,30,51,.10);
  --f-display:"Montserrat","Public Sans",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --r-sm:11px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1310; --surface:#121D18; --surface-2:#17251F; --line:#22332A; --line-strong:#304538;
  --ink:#E7EFEA; --ink-2:#C2D0C8; --muted:#93A69B;
  --brand:#2FA34E; --brand-strong:#5BD077; --brand-soft:#15321F; --brand-glow:#5BD077;
  --gold:#E3A84A; --gold-soft:#30250F; --red:#F07167; --red-soft:#3A1715; --navy:#9DB8F2; --navy-soft:#16223A; --violet:#B7A6F5; --violet-soft:#241D40; --rose:#F28DB2; --rose-soft:#3A1726;
  --band:linear-gradient(120deg,#11592C 0%,#0B3D21 50%,#072816 100%);
  --side:linear-gradient(185deg,#0B3221 0%,#08261A 100%);
  --page:linear-gradient(180deg,#0E1A15 0,#0B1310 360px);
  --weave-ink:none;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1310; --surface:#121D18; --surface-2:#17251F; --line:#22332A; --line-strong:#304538;
  --ink:#E7EFEA; --ink-2:#C2D0C8; --muted:#93A69B;
  --brand:#2FA34E; --brand-strong:#5BD077; --brand-soft:#15321F; --brand-glow:#5BD077;
  --gold:#E3A84A; --gold-soft:#30250F; --red:#F07167; --red-soft:#3A1715; --navy:#9DB8F2; --navy-soft:#16223A; --violet:#B7A6F5; --violet-soft:#241D40; --rose:#F28DB2; --rose-soft:#3A1726;
  --band:linear-gradient(120deg,#11592C 0%,#0B3D21 50%,#072816 100%);
  --side:linear-gradient(185deg,#0B3221 0%,#08261A 100%);
  --page:linear-gradient(180deg,#0E1A15 0,#0B1310 360px);
  --weave-ink:none;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background-color:var(--bg);background-image:var(--weave-ink),var(--page);background-attachment:fixed;color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand-glow);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.cap{text-transform:capitalize}
.center{text-align:center}
.hint{font-size:12.5px;color:var(--muted)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.skip{position:absolute;left:8px;top:-60px;z-index:100;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-weight:600}
.skip:focus{top:8px}
.preview{background:var(--gold-soft);color:var(--ink);border-bottom:1px solid var(--line);font-size:13px;padding:8px max(16px,env(safe-area-inset-left,0px));text-align:center}

/* ---------- controls ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input{height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:0 12px;width:100%}
.input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.pin{letter-spacing:.4em;font-variant-numeric:tabular-nums}
.pinwrap{position:relative}.pinwrap .input{padding-right:48px}
.pinwrap button{position:absolute;right:4px;top:4px;width:36px;height:36px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.pinwrap button:hover{color:var(--ink);background:var(--surface-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:var(--r-sm);border:1px solid transparent;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .15s,box-shadow .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:#0F6B2E}
.btn-ghost{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--surface);border-color:var(--line-strong);color:var(--red)}
.btn-danger:hover{background:var(--red-soft)}
.btn-glass{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:#fff;backdrop-filter:blur(6px)}
.btn-glass:hover{background:rgba(255,255,255,.2)}
.btn-sun{background:#F5B92E;color:#3A2600}
.btn-sun:hover{background:#E5A520}
.btn-sm{height:36px;padding:0 12px;font-size:13.5px}
.btn-lg{height:48px;font-size:15.5px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.is-busy{opacity:.8;cursor:progress!important}
.sync-pill{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:80;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.new-bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:85;display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:999px;padding:6px 6px 6px 14px;box-shadow:0 10px 30px -8px rgba(14,30,51,.35);font-size:14px;font-weight:600;max-width:calc(100vw - 32px)}
.new-bar>svg.i{color:var(--brand-strong)}
.new-bar .icon-btn{width:32px;height:32px;border:0}
.new-bar span{white-space:nowrap}
@media (max-width:1100px){.new-bar{top:calc(64px + env(safe-area-inset-top,0px));left:16px;right:16px;transform:none;justify-content:space-between}.new-bar span{flex:1;white-space:normal}}
.sync-pill.off{background:var(--gold-soft);color:var(--gold);border:1px solid currentColor}
.sync-pill svg.i{width:16px;height:16px}
@media (max-width:1100px){.sync-pill{top:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn[disabled]{opacity:.4;cursor:default}
.error{color:var(--red);font-size:13.5px;min-height:1em;margin:0}
.warn-note{display:flex;gap:8px;align-items:flex-start;background:var(--gold-soft);color:var(--gold);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;font-weight:600}
.info-note{display:flex;gap:8px;align-items:flex-start;background:var(--navy-soft);color:var(--navy);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg.two-up{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg input{position:absolute;opacity:0}
.seg label{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;background:var(--surface);transition:border-color .15s,background .15s}
.seg label b{font-size:14px;display:flex;align-items:center;gap:6px}
.seg label small{color:var(--muted);font-size:12px}
.seg input:checked+label{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.seg input:focus-visible+label{outline:3px solid var(--brand-glow);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 14px;min-height:36px;font-size:13.5px;cursor:pointer}
.chip:hover{border-color:var(--brand);color:var(--brand-strong)}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);cursor:pointer}
.check input,.keep input{width:18px;height:18px;margin-top:2px;accent-color:var(--brand);flex:none}
.keep{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2);cursor:pointer}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:16px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- pills, chips, badges ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.Confirmed{background:var(--brand-soft);color:var(--brand-strong)}
.pill.Pending{background:var(--gold-soft);color:var(--gold)}
.pill.Rejected{background:var(--red-soft);color:var(--red)}
.pill.off{background:var(--surface-2);color:var(--muted)}
.pill.hol{background:var(--navy-soft);color:var(--navy)}
.badge{margin-left:auto;background:var(--sun);color:#3A2600;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.dbadge{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--dc);color:var(--dfg);flex:none;box-shadow:inset 0 0 0 1px rgba(14,30,51,.14);overflow:hidden}
.dbadge img{width:100%;height:100%;object-fit:cover}
.dbadge svg.i{width:56%;height:56%}
.dchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.dchip i{width:10px;height:10px;border-radius:3px;background:var(--dc);box-shadow:inset 0 0 0 1px rgba(14,30,51,.3);flex:none}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:#08261A;font-weight:800;font-size:13px;flex:none}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);background:var(--surface)}
.auth-main{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background-image:var(--weave-ink)}
.auth-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px}
.auth-title{display:flex;align-items:center;gap:14px}
.auth-title .seal{width:60px;height:60px;flex:none}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-strong);margin:0}
.auth-card h1{font-size:30px;font-weight:800;margin-top:2px}
.lede{color:var(--muted);margin:0}
.auth-photo{order:2;position:relative;display:flex;align-items:flex-end;padding:48px;color:#fff;overflow:hidden;background:#0B3D20 url("capitol.webp?v=2") center 40%/cover no-repeat}
.auth-photo::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(5,28,16,.9) 0%,rgba(5,28,16,.55) 32%,rgba(5,28,16,0) 62%)}
.auth-brand{position:relative;display:flex;flex-direction:column;gap:16px}
.wordmark{width:min(300px,60%);height:auto;filter:drop-shadow(0 2px 10px rgba(0,0,0,.35))}
.socials{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:16px}
.socials span{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
.socials svg.i{width:16px;height:16px}
.socials b{margin-left:6px;font-weight:700}
.divpick{border:0;padding:0;margin:0;min-width:0}
.divpick legend{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px;padding:0}
.divgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.divpick input{position:absolute;opacity:0}
.divpick label{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:12px 6px 10px;font-size:12.5px;line-height:1.25;font-weight:600;position:relative;height:100%;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);cursor:pointer}
.divpick label:hover{border-color:var(--brand)}
.divpick .tick{position:absolute;top:6px;right:6px;color:var(--brand);opacity:0}
.divpick .tick svg.i{width:14px;height:14px}
.divpick input:checked+label{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:var(--brand-soft)}
.divpick input:checked+label .tick{opacity:1}
.divpick input:focus-visible+label{outline:3px solid var(--brand-glow);outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{background:var(--weave),var(--side);color:#E8F3EC;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 14px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 20px;border-bottom:1px solid rgba(232,243,236,.12)}
.brand img{width:44px;height:44px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:15px;line-height:1.15;display:block}
.brand small{color:#A9C7B4;font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:16px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:#B9D3C2;padding:10px 12px;border-radius:var(--r-sm);cursor:pointer;text-align:left;font-weight:500;position:relative}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--mint)}
.side-foot{margin-top:auto;border-top:1px solid rgba(232,243,236,.12);padding-top:14px}
.side-foot .nav{margin-top:6px}
.who{display:flex;gap:10px;align-items:center;padding:6px}
.who b{display:block;font-size:14px}
.who small{color:#A9C7B4;font-size:12px}
.topbar,.tabbar{display:none}

.main{min-width:0;padding-bottom:56px}
.band{background:var(--weave),var(--band);color:#fff;padding:28px max(24px,env(safe-area-inset-right,0px)) 76px max(24px,env(safe-area-inset-left,0px));position:relative;overflow:hidden}

.band-in{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;position:relative;z-index:1}
.band .eyebrow{color:#8FE3A6}
.band h1{font-size:28px;font-weight:800;margin-top:4px}
.band p{margin:6px 0 0;color:#CFE6D7;max-width:62ch}
.band .dchip{color:#E8F3EC}
.quip{display:flex;align-items:center;gap:8px;margin-top:10px;width:fit-content;max-width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 14px 6px 10px;font-size:13.5px;color:#fff;font-weight:500}
.quip svg.i{width:16px;height:16px;color:#F5B92E;flex:none}
.wrap{max-width:1180px;margin:-52px auto 0;padding-inline:max(24px,env(safe-area-inset-left,0px));position:relative;z-index:2;display:flex;flex-direction:column;gap:20px;animation:rise .28s ease-out}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- panels & widgets ---------- */
.panel{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel-h h2 svg.i{color:var(--brand-strong)}
.panel-h select.input{height:36px;width:auto;max-width:100%}
.panel-b{padding:18px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;align-items:start}
.span-12{grid-column:span 12}.span-7{grid-column:span 7}.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-8{grid-column:span 8}.span-4{grid-column:span 4}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{padding:16px 18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
button.tile{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%;transition:border-color .15s,transform .15s,box-shadow .15s}
button.tile:hover{border-color:var(--brand)}
.tile .k{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.tile .k .ib{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-strong);flex:none}
.tile .k .ib svg.i{width:16px;height:16px}
.tile.warn .k{color:var(--gold)} .tile.warn .k .ib{background:var(--gold-soft);color:var(--gold)}
.tile .go{margin-left:auto;color:var(--muted);display:flex}
.tile .v{font-family:var(--f-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .s{font-size:13px;color:var(--muted)}


.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#127238 0%,#0B4F27 100%);color:#fff;border-radius:22px;padding:26px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;box-shadow:var(--shadow)}

.hero>*{position:relative;z-index:1}
.hero-main{font:inherit;color:inherit;text-align:left;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column}
.hero .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A9DDB8}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:46px;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.hero .sub{color:#CFE6D7;margin-top:6px;font-size:14px}
.hero-main:hover .big{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.hero-r{display:flex;flex-direction:column;gap:10px;align-items:stretch;min-width:240px}
.hero .box{font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.09);border:1px solid rgba(232,243,236,.22);border-radius:12px;padding:12px 14px}
.hero .box:hover{background:rgba(255,255,255,.15)}
.hero .box b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.hero .box span{font-size:13px;color:#CFE6D7}

.mine{display:flex;align-items:center;gap:14px;flex-wrap:wrap;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--surface);border:1px solid color-mix(in srgb,var(--brand) 28%,transparent);border-radius:var(--r);padding:14px 18px;box-shadow:var(--shadow)}
.mine .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-strong)}
.mine b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.mine .go{margin-left:auto;color:var(--brand-strong);display:flex}
.mine:hover{border-color:var(--brand)}

.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.row .body{min-width:0;flex:1}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .acts{display:flex;gap:6px;flex:none;flex-wrap:wrap}
.row.rv{flex-wrap:wrap}.row.rv .body{flex:1 1 160px}.row.rv .acts{flex:1 0 100%;padding-left:48px}
.mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.mark.earn{background:var(--brand-soft);color:var(--brand-strong)}
.mark.use{background:var(--gold-soft);color:var(--gold)}
.mark.pend{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-strong)}
.mark.hol{background:var(--navy-soft);color:var(--navy)}
.mark.act{background:var(--surface-2);color:var(--ink-2)}
.amt.plus,td.plus{color:var(--brand-strong)} .amt.minus,td.minus{color:var(--gold)}
.tap{cursor:pointer}
.list .row.tap:hover,tr.tap:hover td{background:var(--surface-2)}
.list.boxed{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.empty .ill{width:56px;height:56px;margin:0 auto 10px;border-radius:16px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-strong)}
.empty .ill svg.i{width:26px;height:26px}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:10px 18px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:12px 18px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.total td{border-top:2px solid var(--line-strong);background:var(--surface-2);font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select{height:36px;width:auto;min-width:130px}
.tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(14,30,51,.12)}

/* charts */
.chart{padding:14px 18px 8px}
.chart svg{width:100%;height:auto;display:block}
.chart text{font:600 11px var(--f-body);fill:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:0 18px 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.hbar{display:flex;flex-direction:column;gap:12px;padding:16px 18px}
.hbar .r1{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.hbar .track{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:6px;box-shadow:inset 0 0 0 1px var(--line)}
.hbar .fill{height:100%;border-radius:999px;background:var(--dc);box-shadow:inset 0 0 0 1px rgba(14,30,51,.35)}

/* calendar */
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav h2{min-width:170px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:10px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.day{min-height:108px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;background:var(--surface);cursor:pointer;text-align:left;min-width:0;font:inherit;color:inherit}
.day:nth-child(7n){border-right:0}
.day:hover{background:var(--surface-2)}
.day.out{background:var(--bg);color:var(--muted)}
.day.wknd{background:color-mix(in srgb,var(--surface-2) 60%,var(--surface))}
.day.isHol{background:color-mix(in srgb,var(--navy-soft) 55%,var(--surface))}
.day.sel{box-shadow:inset 0 0 0 2px var(--brand)}
.dn{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.day.today .dn{background:var(--brand);color:#fff}
.hl{font-size:11px;font-weight:700;color:var(--navy);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev{font-size:11.5px;line-height:1.3;border-radius:5px;padding:2px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ev.earn{background:var(--brand-soft);color:var(--brand-strong)}
.ev.use{background:var(--gold-soft);color:var(--gold)}
.ev.pend{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-strong)}
.more{font-size:11.5px;color:var(--muted)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(6,20,13,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:22px;width:100%;max-width:480px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);border:1px solid var(--line);animation:pop .2s ease-out}
@keyframes pop{from{opacity:.001;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal .panel-b{display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.detail-top{display:flex;align-items:center;gap:14px}
.detail-top .mark{width:46px;height:46px;border-radius:13px}
.big-amt{font-family:var(--f-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;margin-bottom:4px}
.big-amt.plus{color:var(--brand-strong)}.big-amt.minus{color:var(--gold)}
.kvs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-sm)}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv span{color:var(--muted)}.kv b{font-weight:600;overflow-wrap:anywhere}
.mini-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mini-tiles div{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column}
.mini-tiles span{font-size:12px;color:var(--muted);font-weight:600}
.mini-tiles b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.wlist{display:flex;flex-direction:column;gap:6px}
.wlist .w{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm)}
.wlist .w label{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:14px}
.wlist .w input{width:18px;height:18px;accent-color:var(--brand)}
.wlist .w .icon-btn{width:32px;height:32px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:32px;height:32px;border-radius:8px;border:1px solid var(--line-strong);cursor:pointer;background:var(--dc);padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--brand);outline-offset:2px}
.swatches input[type=color]{width:44px;height:32px;padding:0 2px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);cursor:pointer}
.iconpick{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.iconpick button{height:38px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconpick button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-strong)}
.logo-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.acct{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100vw - 32px);text-align:center}
.loading{min-height:100vh;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:16px}
.loading img{width:72px;height:72px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.print-head{display:none}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .span-7,.span-5,.span-6,.span-8,.span-4{grid-column:span 12}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:20;background:var(--weave),var(--band);color:#E8F3EC;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .topbar img{width:32px;height:32px}
  .topbar b{font-family:var(--f-display);font-weight:800;font-size:15px;flex:1;margin-left:6px}
  .topbar button{background:none;border:0;color:#E8F3EC;display:grid;place-items:center;width:40px;height:40px;border-radius:10px;cursor:pointer}
  .band{padding:18px 16px 64px;background:var(--weave),var(--band)}
  .band h1{font-size:23px}
  .band-in{align-items:flex-start}
  .wrap{padding-inline:max(16px,env(safe-area-inset-left,0px));margin-top:-48px}
  .main{padding-bottom:120px}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;
    background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 30px -10px rgba(14,30,51,.35);padding:6px}
  .tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:7px 2px;cursor:pointer;position:relative;border-radius:16px}
  .tabbar button[aria-current="page"]{color:var(--brand-strong);background:var(--brand-soft)}
  .tabbar .badge{position:absolute;top:2px;left:56%;margin:0;padding:0 6px}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:860px){
  .auth{grid-template-columns:minmax(0,1fr);min-height:0}
  .auth-photo{order:0;min-height:230px;padding:20px max(16px,env(safe-area-inset-left,0px));background-position:center 30%}
  .auth-photo::before{background:linear-gradient(to top,rgba(5,28,16,.92) 0%,rgba(5,28,16,.6) 45%,rgba(5,28,16,.1) 100%)}
  .wordmark{width:120px}
  .socials{font-size:14px}.socials span{width:26px;height:26px}
  .auth-main{padding-block:24px 40px;align-items:flex-start}
  .auth-title .seal{width:48px;height:48px}
  .auth-card h1{font-size:26px}
  .scrim{align-items:end;padding:0}
  .modal{max-width:none;border-radius:24px 24px 0 0;max-height:92vh;padding-bottom:env(safe-area-inset-bottom,0px);animation:sheet .25s ease-out}
  @keyframes sheet{from{transform:translateY(40px);opacity:.001}to{transform:none;opacity:1}}
  .day{min-height:68px;padding:4px}
  .ev{font-size:0;padding:0;height:6px;border-radius:3px}
  .hl{font-size:0;height:4px;border-radius:2px;background:var(--navy);width:70%}
  .more{display:none}
  .hero .big{font-size:38px}
}
@media (max-width:560px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tiles.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .tiles.three .tile{padding:12px 10px}
  .tiles.three .tile .k{font-size:10.5px;letter-spacing:.03em}
  .tiles.three .tile .k .ib,.tiles.three .tile .go,.tiles.three .tile .s{display:none}
  .tiles.three .tile .v{font-size:18px}
  .tile .v{font-size:22px}
  .seg{grid-template-columns:minmax(0,1fr)}
  .two{grid-template-columns:minmax(0,1fr)}
  .row{padding:12px 14px}
  .cal-nav h2{min-width:0;font-size:15px}
  .dn{font-size:12px;width:22px;height:22px}
  .hero{padding:20px}
  .hero-r{min-width:0;width:100%}
  .iconpick{grid-template-columns:repeat(4,minmax(0,1fr))}
  .kv{grid-template-columns:96px minmax(0,1fr)}
}
@media print{
  .side,.topbar,.tabbar,.band,.preview,.no-print,.toast,#modal{display:none!important}
  body{background:#fff}
  .shell{display:block}.wrap{margin:0;padding:0;max-width:none}
  .panel{box-shadow:none;border:1px solid #ccc}
  .print-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .print-head img{width:48px;height:48px}
  th{background:#eee}
}
/* ---------- splash: the PIO seal fills with a liquid wave while a ring draws around it (2 s) ---------- */
#splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
.sp{position:relative;width:136px;height:136px}
.sp img{position:absolute;left:12px;top:12px;width:112px;height:112px}
.sp-base{filter:grayscale(1);opacity:.16}
.sp-fill{-webkit-mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='112' height='224' viewBox='0 0 112 224'><path d='M0 12 Q14 0 28 12 T56 12 T84 12 T112 12 V224 H0 Z'/></svg>");mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='112' height='224' viewBox='0 0 112 224'><path d='M0 12 Q14 0 28 12 T56 12 T84 12 T112 12 V224 H0 Z'/></svg>");
  -webkit-mask-size:112px 224px;mask-size:112px 224px;-webkit-mask-repeat:repeat-x;mask-repeat:repeat-x;-webkit-mask-position:0 112px;mask-position:0 112px;animation:liquid 1.6s cubic-bezier(.45,.05,.35,1) .1s forwards}
@keyframes liquid{to{-webkit-mask-position:-224px -16px;mask-position:-224px -16px}}
.sp-ring{position:absolute;inset:0;width:136px;height:136px;transform:rotate(-90deg)}
.sp-ring circle{fill:none;stroke-width:3;stroke-linecap:round}
.sp-ring .r1{stroke:var(--brand);stroke-dasharray:415;stroke-dashoffset:415;animation:draw 1.5s cubic-bezier(.65,0,.35,1) .1s forwards}
.sp-ring .r2{stroke:var(--sun);stroke-width:2;stroke-dasharray:415;stroke-dashoffset:415;opacity:.8;animation:draw 1.5s cubic-bezier(.65,0,.35,1) .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sp-done{animation:pop .3s ease-out 1.65s both}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.sp-name{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--ink);opacity:0;animation:fadein .5s ease .7s forwards}
.sp-name small{display:block;text-align:center;font-family:var(--f-body);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-strong);margin-top:2px}
@keyframes fadein{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sp-fill{-webkit-mask:none;mask:none}.sp-ring circle{stroke-dashoffset:0}.sp-name{opacity:1}}
/* ---------- Overwatch: availability, travel orders, leaves ---------- */
.nav-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7FA58D;padding:14px 12px 4px}
.nav-h:first-child{padding-top:2px}
.pill.st-to,.st-to{background:var(--violet-soft);color:var(--violet)}
.pill.st-lv,.st-lv{background:var(--rose-soft);color:var(--rose)}
.pill.st-off,.st-off{background:var(--gold-soft);color:var(--gold)}
.st-ok{background:var(--brand-soft);color:var(--brand-strong)}
.legend i.st-to,.legend i.st-lv,.legend i.st-off,.legend i.st-ok{box-shadow:inset 0 0 0 1px currentColor}
.ev.to{background:var(--violet-soft);color:var(--violet)}
.ev.lv{background:var(--rose-soft);color:var(--rose)}
table.week th.c,table.week td.c{text-align:center;padding:8px 6px;min-width:56px}
table.week th.c .num{font-size:15px;color:var(--ink)}
table.week .nw{background:var(--surface-2)}
table.week .on{box-shadow:inset 0 0 0 2px var(--brand)}
table.week th:first-child,table.week td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--line)}
table.week th:first-child{background:var(--surface-2)}
@media (max-width:560px){table.week td:first-child b{display:block;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}table.week th.c,table.week td.c{min-width:44px;padding:8px 4px}}
.dot{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;font-size:12px;font-weight:800}
.dot.ok{background:var(--brand-soft);color:var(--brand-strong);font-weight:700}
.to-card{display:flex;gap:16px;padding:16px 18px;border-top:1px solid var(--line);align-items:flex-start}
.list .to-card:first-child{border-top:0}
.to-date{width:58px;flex:none;text-align:center;border-radius:12px;background:var(--violet-soft);color:var(--violet);padding:8px 4px}
.to-date b{display:block;font-size:11px;letter-spacing:.08em}
.to-date span{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.1}
.to-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.to-body .t{font-weight:700;font-size:15px}
.to-body .m{font-size:13px;color:var(--muted)}
.to-names{display:flex;flex-wrap:wrap;gap:6px}
.to-names span{font-size:12px;font-weight:700;letter-spacing:.02em;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.to-acts{display:flex;flex-direction:column;gap:6px;flex:none}
.picker{position:relative;display:flex;flex-direction:column;gap:8px}
.chip.on{display:inline-flex;align-items:center;gap:4px;background:var(--violet-soft);color:var(--violet);border-color:transparent;font-weight:700;padding-right:4px;cursor:default}
.chip.on button{border:0;background:none;color:inherit;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;cursor:pointer}
.chip.on button:hover{background:rgba(91,63,196,.15)}
.chip.on svg.i{width:14px;height:14px}
.sug{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);box-shadow:var(--shadow);z-index:5;max-height:240px;overflow:auto}
.sug li{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px}

function apply(d){

  S.holidays = d.holidays || []; S.settings = d.settings || S.settings; S.activity = d.activity || [];

  S.loadedAt = Date.now(); S.lastWrite = d.lastWrite || 0;
  if (remembered()) lSet('pio_cache', JSON.stringify(d));
}
function call(action, p){
  return new Promise(function(resolve, reject){
    function done(r){
      if (r && r.ok){ if (r.fresh) apply(r.fresh); return resolve(r.data); }
      if (r && r.expired){ clearSession(); S.token = null; S.me = null; render(); }
      reject(new Error(r && r.error ? r.error : 'Something went wrong. Please try again.'));
    }
    if (LIVE){
      fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, p: p || {}, token: S.token }) })
        .then(function(r){ return r.text(); }, function(){ throw new Error('net'); })
        .then(function(t){ var j; try { j = JSON.parse(t); } catch(e){ throw new Error('html'); } done(j); })
        .catch(function(e){ var er = new Error(e.message === 'html' ? 'The server sent a web page instead of data. In Apps Script, set the deployment’s access to Anyone and deploy a new version.' : 'Could not reach the server. Check your internet connection and try again.'); er.net = e.message !== 'html'; reject(er); });
    } else setTimeout(function(){ done(Mock.api(action, p || {}, S.token)); }, 150);
  });
}

/* ---------- balances ----------
   Offsets earned in a month become usable on the 1st of the next month and carry over.
   With a carry-over cap, anything above the cap is forfeited at the start of each month.
   The server runs the same calculation (balance_ in Code.gs). */
function ledgerFor(entries, u, cap){
  var earn = {}, use = {}, first = null, cur = curMonth(), months = {};
  entries.forEach(function(e){
    if (e.username !== u || e.status !== 'Confirmed') return;
    var m = e.date.slice(0,7);
    if (e.type === 'EARN') earn[m] = (earn[m] || 0) + e.days; else use[m] = (use[m] || 0) + e.days;
    if (!first || m < first) first = m;
  });
  if (!first) return { avail: 0, months: months };
  var avail = 0, m = first, last = cur;
  Object.keys(use).forEach(function(k){ if (k > last) last = k; });
  while (m <= last){
    var rec = { open: 0, forfeit: 0, earned: earn[m] || 0, used: use[m] || 0 };
    if (m <= cur){
      avail += earn[shiftMonth(m, -1)] || 0;
      if (cap > 0 && avail > cap){ rec.forfeit = avail - cap; avail = cap; }
    }
    rec.open = avail;
    avail -= use[m] || 0;
    rec.close = avail + rec.earned;
    months[m] = rec;
    m = shiftMonth(m, 1);
  }
  return { avail: avail, months: months };
}
function stats(u){
  var L = ledgerFor(S.entries, u, S.settings.carryCap);
  var o = { avail: L.avail, month: 0, pending: 0, pendN: 0, reqDays: 0, reqN: 0, earnedY: 0, usedY: 0, usedM: 0, lastUse: null, upcoming: 0 };
  var y = today().slice(0,4), m = curMonth(), td = today();
  S.entries.forEach(function(e){
    if (e.username !== u) return;
    if (e.status === 'Confirmed'){
      if (e.type === 'EARN'){ if (e.date.slice(0,7) === m) o.month += e.days; if (e.date.slice(0,4) === y) o.earnedY += e.days; }
      else { if (e.date.slice(0,4) === y) o.usedY += e.days; if (e.date.slice(0,7) === m) o.usedM += e.days; if (e.date > td) o.upcoming += e.days; if (e.date <= td && (!o.lastUse || e.date > o.lastUse)) o.lastUse = e.date; }
    } else if (e.status === 'Pending'){
      if (e.type === 'EARN'){ o.pending += e.days; o.pendN++; } else { o.reqDays += e.days; o.reqN++; }
    }
  });
  o.free = o.avail - o.reqDays;
  return o;
}
function sumStats(users){
  var t = { avail: 0, month: 0, pending: 0, usedM: 0 };
  users.forEach(function(u){ var s = stats(u.username); t.avail += s.avail; t.month += s.month; t.pending += s.pending; t.usedM += s.usedM; });
  return t;
}
function ledgerMonth(u, m){
  var L = ledgerFor(S.entries, u, S.settings.carryCap), r = L.months[m];
  var pend = S.entries.filter(function(e){ return e.username === u && e.status === 'Pending' && e.date.slice(0,7) === m && e.type === 'EARN'; }).reduce(function(s, e){ return s + e.days; }, 0);
  if (!r){
    var prior = Object.keys(L.months).filter(function(k){ return k < m; }).sort().pop();
    var open = prior ? L.months[prior].close : 0;
    if (m > curMonth()) open = L.avail;
    r = { open: open, forfeit: 0, earned: 0, used: 0, close: open };
  }
  return { open: r.open, forfeit: r.forfeit, earned: r.earned, used: r.used, close: r.close, pending: pend };
}

function keepForm(root){
  var k = { f: {}, focus: null };
  root.querySelectorAll('input[id],select[id],textarea[id]').forEach(function(el){
    if (el.type === 'file') return;
    var f = el.closest('form[data-form]'); if (f && f.dataset.form === S.sentForm) return;
    k.f[el.id] = (el.type === 'checkbox' || el.type === 'radio') ? { c: el.checked } : { v: el.value };
  });
  var a = document.activeElement;
  if (a && a.id && root.contains(a) && k.f[a.id]) k.focus = { id: a.id, s: a.selectionStart, e: a.selectionEnd };
  return k;
}
function restoreForm(k){
  Object.keys(k.f).forEach(function(id){
    var el = document.getElementById(id), x = k.f[id]; if (!el) return;
    if ('c' in x){ if (el.checked !== x.c) el.checked = x.c; } else if (el.value !== x.v){ el.value = x.v; }
  });
  if (k.focus){ var el = document.getElementById(k.focus.id); if (el){ el.focus({ preventScroll: true }); try { if (k.focus.s != null) el.setSelectionRange(k.focus.s, k.focus.e); } catch(e){} } }
}

/* ---------- charts ---------- */
function trendData(users, n){
  var m = curMonth(), out = [];
  for (var i = n - 1; i >= 0; i--){
    var mm = shiftMonth(m, -i), earned = 0, used = 0;
    S.entries.forEach(function(e){ if (e.status !== 'Confirmed' || e.date.slice(0,7) !== mm || users.indexOf(e.username) < 0) return; if (e.type === 'EARN') earned += e.days; else used += e.days; });
    out.push({ m: mm, earned: earned, used: used });
  }
  return out;
}
function trendChart(data){
  var W = 560, H = 200, pl = 30, pb = 26, pt = 10, max = Math.max(2, Math.ceil(Math.max.apply(null, data.map(function(d){ return Math.max(d.earned, d.used); })))), step = max <= 4 ? 1 : Math.ceil(max / 4);
  max = Math.ceil(max / step) * step;
  var gw = (W - pl) / data.length, bw = Math.min(22, gw / 3.2), y = function(v){ return pt + (H - pt - pb) * (1 - v / max); };
  var g = '';

function nextLongWeekend(){
  var td = today();
  for (var i = -3; i < 35; i++){
    var d = addDays(td, i);
    if (!offDay(d) || offDay(addDays(d, -1))) continue;
    var end = d; while (offDay(addDays(end, 1))) end = addDays(end, 1);

    if (len >= 3 && end >= td){

      return { start: d, end: end, len: len, holiday: h, now: d <= td };
    }
  }

}
function bridgeDay(){
  var td = today();

    var d = addDays(td, i), h = holidayOn(d), w = pd(d).getDay();

    if (w === 2 && !offDay(addDays(d, -1))) return { holiday: h, date: d, bridge: addDays(d, -1) };

  }
  return null;
}

  var groups = [['Leave credits', ['VL','FL','SL']], ['Yearly allowances', ['SPL','WL','SOLO','SEL']], ['Special leaves', ['ML','PL','VAWC','SLBW','RL','STL','AL']], ['Other', ['LWOP']]];

    '<div class="field"><label for="ln">Note <span class="hint">(optional, e.g. Form 6 control no.)</span></label><input class="input" id="ln" name="note" maxlength="160"></div><div id="lbal"></div>',
    '<button type="button" class="btn btn-ghost" data-act="close">Cancel</button><button class="btn btn-primary" type="submit">Record leave</button>', 'recordLeave');

function leaveCheck(recount){
  var u = (document.getElementById('lu2') || {}).value; if (!u) return;
  var t = document.getElementById('lt').value, f = document.getElementById('lf'), to = document.getElementById('lto'), d = document.getElementById('ld'), r = LEAVE_TYPES[t];
  if (to.value < f.value) to.value = f.value;
  if (recount) d.value = workdaysBetween(f.value, to.value, r.calendar) || 1;
  document.getElementById('ldHint').textContent = r.calendar ? 'Calendar days in the range (maternity leave counts every day).' : 'Weekdays in the range, not counting holidays. Change it for half days.';
  var b = leaveBal(u, f.value.slice(0,4)), days = Number(d.value) || 0, msg = '', over = false;
  if (r.pool){ var left = r.pool === 'VL' ? b.vl : b.sl; msg = (r.pool === 'VL' ? 'Vacation' : 'Sick') + ' leave left: ' + fD(left) + (b.set ? '' : ' (balances not set)'); over = days > left + 1e-9; }
  var cap = t === 'WL' ? wellCap() : r.year; if (cap){ var l2 = Math.max(cap - (b.used[t] || 0), 0); msg += (msg ? ' · ' : '') + r.name + ' left this year: ' + fD(l2); over = over || days > l2 + 1e-9; }
  if (t === 'WL' && days > 3){ msg += ' · Wellness leave is up to 3 days in a row.'; over = true; }
  if (r.once) msg += (msg ? ' · ' : '') + 'Up to ' + r.once + ' days per ' + (t === 'AL' ? 'adoption' : 'occurrence') + '.';
  document.getElementById('lbal').innerHTML = (msg ? '<div class="' + (over ? 'warn-note' : 'info-note') + '">' + ic(over ? 'clock' : 'shield') + '<span>' + esc(msg) + (over ? '. Record the extra days as Leave Without Pay, or tick below if HR approved it.' : '') + '</span></div>' : '') +
    (over ? '<label class="keep"><input type="checkbox" name="override"> Record anyway (approved by HR)</label>' : '');
}

/* ----- events for the new screens ----- */
document.addEventListener('click', function(ev){
  var p = ev.target.closest('[data-pick]'); if (p){ addName(p.dataset.pick); return; }
  var t = ev.target.closest('[data-act]'); if (!t) return;
  var a = t.dataset.act;
  if (a === 'avPrev' || a === 'avNext'){ S.availDate = addDays(S.availDate || today(), a === 'avNext' ? 1 : -1); render(); }
  else if (a === 'avToday'){ S.availDate = today(); render(); }
  else if (a === 'toTab'){ S.toFilter = t.dataset.t; render(); }
  else if (a === 'toNew') toModal();
  else if (a === 'toEdit') toModal(t.dataset.id);
  else if (a === 'toManage') toManageModal(t.dataset.id);
  else if (a === 'toCopy'){ var to = S.travelOrders.filter(function(x){ return x.id === t.dataset.id; })[0]; if (to) copyText(toText(to)); }
  else if (a === 'toAddMe') addName(S.me.name);
  else if (a === 'toDrop'){ TO.names.splice(+t.dataset.i, 1); drawChips(); }
  else if (a === 'toDelete'){ if (!sure(t, 'Tap again to delete')) return; busy(t, act('deleteTO', { id: t.dataset.id }, 'Travel order deleted').then(closeModal), 'merr'); }
  else if (a === 'leaveNew') leaveModal(t.dataset.u);
  else if (a === 'credits') creditsModal(t.dataset.u);
  else if (a === 'leaveDel'){ if (t.dataset.sure !== '1'){ t.dataset.sure = '1'; t.style.color = 'var(--red)'; toast('Tap again to remove'); return; } busy(t, act('deleteLeave', { id: t.dataset.id }, 'Leave record removed')); }
  else if (a === 'adjust'){ var dd = Number(document.getElementById('aj').value), rs = document.getElementById('ar2').value;
    busy(t, act('adjustLeave', { username: M.u, pool: document.getElementById('ap2').value, days: dd, note: rs }, 'Adjustment saved').then(closeModal), 'merr'); }
  else if (a === 'exportLeaves'){ download('leave-records-' + today() + '.csv', csv([['Employee','Type','From','To','Days','Note','Recorded by','Recorded at']].concat(S.leaves.map(function(l){ return [userName(l.username), leaveName(l.type), l.dateFrom, l.dateTo, l.days, l.note, l.createdBy, l.createdAt]; }))), 'text/csv'); toast('Leave records downloaded'); }
});
document.addEventListener('keydown', function(ev){
  if (ev.target.id !== 'tp') return;
  var ul = document.getElementById('toSug'), items = ul ? Array.prototype.slice.call(ul.querySelectorAll('li')) : [], cur = items.findIndex(function(li){ return li.getAttribute('aria-selected') === 'true'; });
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp'){ ev.preventDefault(); if (!items.length) return; var nx = (cur + (ev.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; items.forEach(function(li, i){ li.setAttribute('aria-selected', String(i === nx)); }); }
  else if (ev.key === 'Enter'){ ev.preventDefault(); if (cur >= 0) addName(items[cur].dataset.pick); else if (ev.target.value.trim()) addName(ev.target.value); }
  else if (ev.key === 'Backspace' && !ev.target.value && TO.names.length){ TO.names.pop(); drawChips(); }
});
document.addEventListener('input', function(ev){
  if (ev.target.id === 'tp') showSug(ev.target.value);
  if (ev.target.id === 'ld') leaveCheck(false);
});
document.addEventListener('change', function(ev){
  var id = ev.target.id;
  if (id === 'avDate' && ev.target.value){ S.availDate = ev.target.value; render(); }
  if (id === 'toMine'){ S.toMine = ev.target.checked; render(); }
  if (id === 'tf' || id === 'tt') drawChips();
  if (id === 'lu2' || id === 'lt' || id === 'lf' || id === 'lto') leaveCheck(id !== 'lu2');
  if (ev.target.dataset.setemp){ var el = ev.target; el.disabled = true; act('setEmpType', { username: el.dataset.setemp, empType: el.value }, 'Employment type updated').then(function(){ if (document.getElementById('pemp')) personModal(el.dataset.setemp); }).catch(function(e){ toast(e.message); el.disabled = false; }); }
});
document.addEventListener('submit', function(ev){
  var f = ev.target.closest('form[data-form]'); if (!f) return;
  var kind = f.dataset.form, btn = f.querySelector('[type=submit]'), d = {};
  new FormData(f).forEach(function(v, k){ if (typeof v === 'string') d[k] = v; });
  var p;
  if (kind === 'saveTO'){ var pend = document.getElementById('tp').value.trim(); if (pend) addName(pend); d.names = TO.names.join('\n'); d.id = TO.id; p = act('saveTO', d, TO.id ? 'Travel order saved' : 'Travel order filed. An admin will prepare it.').then(closeModal); }
  else if (kind === 'toStatus'){ d.id = M.id; p = act('setTOStatus', d, 'Travel order updated').then(closeModal); }
  else if (kind === 'recordLeave'){ d.override = !!d.override; p = act('recordLeave', d, 'Leave recorded').then(closeModal); }
  else if (kind === 'credits'){ d.username = M.u; p = act('setCredits', d, 'Balances saved').then(closeModal); }
  if (p) busy(btn, p, 'merr');
});

ICONS.peso = '<path d="M7 21V3h5.5a5 5 0 0 1 0 10H7"/><path d="M4 7h16M4 10h16"/>';
function peso(n){ return '₱' + (Number(n) || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function toOf(id){ return S.travelOrders.filter(function(t){ return t.id === id; })[0]; }

/* ---------- TEVs ---------- */
var TEV_ST = { 'To prepare': ['To prepare', 'off', 'Being prepared'], 'Pending': ['Pending', 'Pending', 'Waiting for the cheque'], 'Claimed': ['Claimed', 'Confirmed', 'Cheque released'] };
var COVER = [['transpo', 'Transportation'], ['food', 'Food'], ['lodging', 'Accommodation'], ['other', 'Other']];
function tevSums(list){
  var o = { released: 0, pending: 0, prep: 0, prepN: 0, pendN: 0, relN: 0 };
  list.forEach(function(v){ if (v.status === 'Claimed'){ o.released += v.total; o.relN++; } else if (v.status === 'Pending'){ o.pending += v.total; o.pendN++; } else { o.prep += v.total; o.prepN++; } });
  return o;
}
function tevYear(v){ var t = toOf(v.toId); return (v.releasedOn || (t && t.dateFrom) || v.submittedOn || '').slice(0, 4); }
function tevTiles(list, budget, cls){
  var s = tevSums(list), left = budget ? budget - s.released - s.pending : null;
  return '<div class="tiles' + (budget == null ? ' three ' : ' ') + (cls || '') + '">' +
    tile('Released', peso(s.released), s.relN + ' claimed', '', 'check', 'data-act="tevTab" data-t="Claimed"') +
    tile('Pending', peso(s.pending), s.pendN + ' waiting for the cheque', s.pendN ? 'warn' : '', 'clock', 'data-act="tevTab" data-t="Pending"') +
    tile('To prepare', String(s.prepN), s.prep ? peso(s.prep) + ' drafted' : 'Not yet submitted', '', 'edit', 'data-act="tevTab" data-t="To prepare"') +
    (budget != null ? tile('Left for spending', budget ? peso(left) : '—', budget ? 'Of ' + peso(budget) + ' this year' : (isAdmin() ? 'Set the TEV budget in Settings' : 'No budget set'), left != null && left < 0 ? 'warn' : '', 'peso', isAdmin() && !budget ? 'data-go="settings"' : '') : '') + '</div>';
}
function tevRow(v){

  return '<li class="row' + (adm && !v._saving ? ' tap" data-act="tevEdit" data-id="' + v.id + '" tabindex="0' : '') + '"><span class="avatar">' + esc(initials(v.name)) + '</span><div class="body"><div class="t">' + esc(v.name) + '</div>' +
    '<div class="m">' + (cov.length ? cov.map(function(c){ return c[1] + ' ' + peso(v[c[0]]); }).join(' · ') : 'No amounts yet') +

apply = function(d){

/* Swipe the menu in from the left edge, or swipe it away (phones and tablets). */
(function(){
  var mq = window.matchMedia('(max-width:1100px)'), t = null;
  function side(){ return document.querySelector('.side'); }
  function scrim(){ return document.querySelector('.drawer-scrim'); }
  function setOpen(on){
    document.body.classList.toggle('drawer-open', on);
    document.querySelectorAll('[data-act=drawer]').forEach(function(b){ b.setAttribute('aria-expanded', String(on)); });
  }
  function clear(){ var s = side(), c = scrim(); if (s) s.style.transform = ''; if (c) c.style.opacity = ''; document.body.classList.remove('drawer-drag'); }
  document.addEventListener('touchstart', function(e){
    if (!mq.matches || e.touches.length !== 1 || !side() || document.getElementById('modal') && document.getElementById('modal').childElementCount) return;
    var x = e.touches[0].clientX, y = e.touches[0].clientY, open = document.body.classList.contains('drawer-open');
    if (!open && x > 28) return;
    if (open && !(e.target.closest && e.target.closest('.side,.drawer-scrim'))) return;
    t = { x0: x, y0: y, open: open, w: side().offsetWidth, dx: 0, t0: Date.now(), live: false };
  }, { passive: true });
  document.addEventListener('touchmove', function(e){
    if (!t) return;
    var dx = e.touches[0].clientX - t.x0, dy = e.touches[0].clientY - t.y0;
    if (!t.live){
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if (Math.abs(dy) > Math.abs(dx)) { t = null; return; }   // vertical scroll wins
      t.live = true; document.body.classList.add('drawer-drag');
    }
    t.dx = dx;
    var pos = Math.max(0, Math.min(t.w, (t.open ? t.w : 0) + dx));
    side().style.transform = 'translateX(' + (pos - t.w) + 'px)';
    var c = scrim(); if (c) c.style.opacity = String(pos / t.w);
  }, { passive: true });
  document.addEventListener('touchend', function(){
    if (!t) return;
    var g = t; t = null;
    if (!g.live) return;
    var fast = Math.abs(g.dx) / Math.max(1, Date.now() - g.t0) > 0.45;
    var on = g.open ? !(g.dx < -g.w * 0.3 || (fast && g.dx < 0)) : (g.dx > g.w * 0.3 || (fast && g.dx > 0));
    clear(); setOpen(on);
  });
  document.addEventListener('touchcancel', function(){ if (t){ t = null; clear(); } });
})();
